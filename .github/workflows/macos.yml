name: macOS

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on arm64, macos-15-intel on x64
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Debug and Release
        run: |
          for config in Debug Release; do
            cmake -S . -B build-$config -DCMAKE_BUILD_TYPE=$config
            cmake --build build-$config --parallel
            ctest --test-dir build-$config --output-on-failure
          done
