name: MinGW

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.sys }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # mingw64 builds 64-bit programs and mingw32 32-bit ones, both with GCC
        sys: [mingw64, mingw32]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          pacboy: gcc:p cmake:p ninja:p

      - name: Debug and Release
        run: |
          for config in Debug Release; do
            cmake -S . -B build-$config -G Ninja -DCMAKE_BUILD_TYPE=$config
            cmake --build build-$config
            ctest --test-dir build-$config --output-on-failure
          done
