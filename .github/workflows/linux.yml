name: Linux

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest,    cc: clang, cxx: clang++ }
          - { os: ubuntu-24.04-arm, cc: gcc,   cxx: g++ }
          - { os: ubuntu-24.04-arm, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug and Release
        run: |
          for config in Debug Release; do
            cmake -S . -B build-$config -DCMAKE_BUILD_TYPE=$config
            cmake --build build-$config --parallel
            ctest --test-dir build-$config --output-on-failure
          done
